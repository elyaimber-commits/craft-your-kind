<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>פותח WhatsApp</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f8;
        color: #1f2933;
      }
      main {
        text-align: center;
        padding: 24px;
      }
      a {
        color: #128c7e;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>פותח WhatsApp...</h1>
      <p>אם זה לא נפתח אוטומטית, <a id="fallback" href="#">לחץ כאן</a>.</p>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const target = params.get("to") || "";
      const delay = Math.min(Number(params.get("delay") || 75), 5000);
      const isAllowedTarget =
        target.startsWith("https://web.whatsapp.com/send?") ||
        target.startsWith("https://wa.me/") ||
        target.startsWith("whatsapp://send?");

      if (isAllowedTarget) {
        try {
          window.opener = null;
        } catch (_) {}
        document.getElementById("fallback").href = target;
        window.setTimeout(() => window.location.replace(target), delay);
      } else {
        document.querySelector("h1").textContent = "קישור WhatsApp לא תקין";
        document.querySelector("p").textContent = "לא ניתן לפתוח את הקישור.";
      }
    </script>
  </body>
</html>
